[project]
name = "realtor-agent"
version = "0.1.0"
description = "A real estate agent powered by AI"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "click>=8.0.0",
    "fastapi>=0.68.0",
    "pydantic>=1.8.0",
    "uvicorn>=0.15.0",
    "httpx>=0.24.0",
    "python-jose>=3.3.0",
    "requests>=2.31.0",
    "python-dotenv>=0.19.0",
    "notion-client>=2.2.1",
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.118.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.18.1",
    "webdriver-manager>=4.0.1"
]
requires-python = ">=3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realtor_agent"] 