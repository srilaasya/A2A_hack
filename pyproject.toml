[project]
name = "realtor-agent"
version = "0.1.0"
description = "A simple realtor agent that helps users search for properties"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "pydantic>=1.8.0",
    "python-dotenv>=0.19.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realtor_agent"] 